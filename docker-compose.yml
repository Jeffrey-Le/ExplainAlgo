version: "3.9"

services:
  # ── Frontend (Vite React → Nginx) ───────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - explainalgo
    restart: unless-stopped

  # ── API Gateway (Flask) ──────────────────────────────────────────
  # Handles auth, problem CRUD, history, and proxies /create + /analyze
  # to ai-service once that split happens. For now it's the full backend.
  api-gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - APP_SETTINGS=config.DevelopmentConfig
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://explainalgo:explainalgo@postgres:5432/explainalgo
      - SECRET_KEY=${SECRET_KEY}
      - API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - explainalgo
    restart: unless-stopped
    # Run Alembic migrations before starting gunicorn.
    # This is safe for dev; in prod use a separate init container.
    command: >
      sh -c "flask db upgrade && gunicorn --workers 2 --timeout 120 --bind 0.0.0.0:5000 run:flask_app"

  # ── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=explainalgo
      - POSTGRES_PASSWORD=explainalgo
      - POSTGRES_DB=explainalgo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explainalgo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - explainalgo
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────
  # Used by Flask-Limiter for rate limiting storage.
  # DB 0: api-gateway rate limiting
  # DB 1: reserved for ai-service (future split)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - explainalgo
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  explainalgo:
    driver: bridge
