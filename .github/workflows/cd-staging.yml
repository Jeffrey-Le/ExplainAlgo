name: CD — Staging

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-west-1                         # change to your region
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-1.amazonaws.com
  BACKEND_REPO: explainalgo/api-gateway
  FRONTEND_REPO: explainalgo/frontend

jobs:
  # ── Build & Push Images to ECR ─────────────────────────────────
  build-and-push:
    name: Build & push to ECR
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        # Tag with short SHA for traceability.
        # staging always gets :staging too so k8s can pin to a stable name.
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "tag=${SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Staging ──────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging         # maps to GitHub Environment (can add protection rules)

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        # Assumes EKS. Swap this step for your cluster provider if different.
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Deploy to staging namespace (Kustomize)
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
        run: |
          # Patch image tags in the staging overlay before applying
          cd k8s/overlays/staging

          kustomize edit set image \
            api-gateway=$ECR_REGISTRY/${{ env.BACKEND_REPO }}:$IMAGE_TAG \
            frontend=$ECR_REGISTRY/${{ env.FRONTEND_REPO }}:$IMAGE_TAG

          kubectl apply -k .
          kubectl rollout status deployment/api-gateway -n explainalgo-staging --timeout=120s
          kubectl rollout status deployment/frontend    -n explainalgo-staging --timeout=120s

      - name: Smoke test staging
        run: |
          STAGING_URL=${{ secrets.STAGING_URL }}
          # Wait for ingress to be reachable, then hit the health endpoint
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $STAGING_URL/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "Staging smoke test passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 10 attempts"
          exit 1
