name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Backend: Lint + Test ───────────────────────────────────────
  backend:
    name: Backend (Flask)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: explainalgo
          POSTGRES_PASSWORD: explainalgo
          POSTGRES_DB: explainalgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U explainalgo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=migrations,__pycache__

      - name: Run tests
        env:
          APP_SETTINGS: config.TestingConfig
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://explainalgo:explainalgo@localhost:5432/explainalgo_test
          SECRET_KEY: ci-test-secret
          API_KEY: fake-key-mocked-in-tests
          REDIS_URL: redis://localhost:6379/0
        run: |
          pip install pytest pytest-cov
          pytest test/ -v --cov=api --cov-report=term-missing

  # ── Frontend: Lint + Build ─────────────────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ── Docker: Validate builds ────────────────────────────────────
  # Catches Dockerfile errors on PRs without pushing anything.
  docker-build-check:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
