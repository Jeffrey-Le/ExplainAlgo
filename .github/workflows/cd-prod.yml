name: CD — Production

on:
  push:
    tags:
      - "v*.*.*"    # triggers on v1.0.0, v1.2.3, etc.

env:
  AWS_REGION: us-west-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-1.amazonaws.com
  BACKEND_REPO: explainalgo/api-gateway
  FRONTEND_REPO: explainalgo/frontend

jobs:
  # ── Verify the tagged commit has a passing staging image ───────
  # Production never rebuilds from source — it promotes the exact
  # image that was already built and tested on staging.
  verify-staging-image:
    name: Verify staging image exists
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4    # ← add this

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve SHA from tag
        id: resolve
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "Deploying images tagged: ${SHA}"

      - name: Check backend image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name ${{ env.BACKEND_REPO }} \
            --image-ids imageTag=staging

      - name: Check frontend image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name ${{ env.FRONTEND_REPO }} \
            --image-ids imageTag=staging

  # ── Deploy to Production ───────────────────────────────────────
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: verify-staging-image
    environment: production
    permissions:
      contents: write    # needed to create GitHub releases

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Resolve image tag
        id: meta
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          echo "tag=${SHA}" >> $GITHUB_OUTPUT

      - name: Deploy to production namespace (Kustomize)
        run: |
          cd k8s/overlays/production

          kustomize edit set image \
            api-gateway=${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:staging \
            frontend=${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:staging

          kubectl apply -k .
          kubectl rollout status deployment/api-gateway -n explainalgo-prod --timeout=300s
          kubectl rollout status deployment/frontend    -n explainalgo-prod --timeout=120s

      - name: Verify production health
        run: |
          echo "Production deployment complete."
          kubectl get pods -n explainalgo-prod

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true  # auto-generates from PR titles since last tag
