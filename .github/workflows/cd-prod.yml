name: CD — Production

on:
  push:
    tags:
      - "v*.*.*"    # triggers on v1.0.0, v1.2.3, etc.

env:
  AWS_REGION: us-west-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-1.amazonaws.com
  BACKEND_REPO: explainalgo/api-gateway
  FRONTEND_REPO: explainalgo/frontend

jobs:
  # ── Verify the tagged commit has a passing staging image ───────
  # Production never rebuilds from source — it promotes the exact
  # image that was already built and tested on staging.
  verify-staging-image:
    name: Verify staging image exists
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve SHA from tag
        id: resolve
        # The git tag points to a commit. We find the image built
        # from that commit's short SHA (done by cd-staging.yml).
        run: |
          SHA=$(git ls-remote origin refs/tags/${{ github.ref_name }} | cut -c1-7)
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "Deploying images tagged: ${SHA}"

      - name: Check backend image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name ${{ env.BACKEND_REPO }} \
            --image-ids imageTag=${{ steps.resolve.outputs.sha }}

      - name: Check frontend image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name ${{ env.FRONTEND_REPO }} \
            --image-ids imageTag=${{ steps.resolve.outputs.sha }}

  # ── Deploy to Production ───────────────────────────────────────
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: verify-staging-image
    environment: production      # GitHub Environment — add required reviewers here
                                 # for a manual approval gate if desired later

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Resolve image tag
        id: meta
        run: |
          SHA=$(git ls-remote origin refs/tags/${{ github.ref_name }} | cut -c1-7)
          echo "tag=${SHA}" >> $GITHUB_OUTPUT

      - name: Tag images as :latest in ECR
        # Promotes the SHA-tagged image to :latest so prod k8s manifests
        # can also reference :latest if needed.
        run: |
          for REPO in ${{ env.BACKEND_REPO }} ${{ env.FRONTEND_REPO }}; do
            MANIFEST=$(aws ecr batch-get-image \
              --repository-name $REPO \
              --image-ids imageTag=${{ steps.meta.outputs.tag }} \
              --query 'images[0].imageManifest' --output text)

            aws ecr put-image \
              --repository-name $REPO \
              --image-tag latest \
              --image-manifest "$MANIFEST"
          done

      - name: Deploy to production namespace (Kustomize)
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
        run: |
          cd k8s/overlays/production

          kustomize edit set image \
            api-gateway=$ECR_REGISTRY/${{ env.BACKEND_REPO }}:$IMAGE_TAG \
            frontend=$ECR_REGISTRY/${{ env.FRONTEND_REPO }}:$IMAGE_TAG

          kubectl apply -k .
          kubectl rollout status deployment/api-gateway -n explainalgo-prod --timeout=180s
          kubectl rollout status deployment/frontend    -n explainalgo-prod --timeout=180s

      - name: Verify production health
        run: |
          PROD_URL=${{ secrets.PROD_URL }}
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $PROD_URL/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "Production health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "Production health check failed"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true  # auto-generates from PR titles since last tag
