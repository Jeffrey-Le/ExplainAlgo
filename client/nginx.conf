server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Static assets: aggressive caching ───────────────────────
    # Vite fingerprints filenames (e.g. main.abc123.js) so
    # long cache TTLs are safe here.
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API proxy → Flask backend ────────────────────────────────
    # The frontend calls /api/*, nginx strips /api and forwards
    # to the Flask container. Keeps the frontend decoupled from
    # the backend's actual host/port.
    location /api/ {
        proxy_pass         http://api-gateway:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Handle Gemini API latency — don't time out too early
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── SPA catch-all ────────────────────────────────────────────
    # React Router handles client-side routing. Any path that
    # isn't a static file or /api/* should serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
