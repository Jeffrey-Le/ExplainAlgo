apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway  # overwritten by kustomize edit set image in CI/CD
          ports:
            - containerPort: 5000
          env:
            - name: APP_SETTINGS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_SETTINGS
            - name: SQLALCHEMY_DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: gemini-api-key
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: redis-url
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          # Run Alembic migrations before the container serves traffic.
          # Using lifecycle hook keeps it in the same container without
          # a separate init container — acceptable for this scale.
          

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
