apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: explainalgo-ingress
  annotations:
    # AWS ALB ingress controller — installed via eksctl addon or helm
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/health/
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    # HTTPS — add your ACM cert ARN here once you have a domain
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:ACCOUNT:certificate/CERT-ID
    # alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  rules:
    - http:
        paths:
          # All /api/* traffic → Flask backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 5000
          # Everything else → Nginx frontend (serves React SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
