apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: explainalgo-prod

bases:
  - ../../base

resources:
  - patches/hpa.yaml
  - postgres-sealed-secret-prod.yaml
  - app-sealed-secret-prod.yaml

patches:
  - path: patches/redis-pvc.yaml
    target:
      kind: Deployment
      name: redis
  - path: patches/resources.yaml
    target:
      kind: Deployment
      name: api-gateway
  - path: patches/resources.yaml
    target:
      kind: Deployment
      name: frontend